# Intégration continue : lint, typecheck, audit des dépendances de production,
# tests unitaires (100 % de couverture exigée) et tests e2e.
# Le workflow est désactivé côté GitHub tant que le dépôt est privé (budget Actions à 0).
# Une fois le dépôt public (Actions gratuit) : gh workflow enable Tests
# Le hook .githooks/pre-push lance les mêmes contrôles en local.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lancement manuel (onglet Actions ou `gh workflow run Tests`)
  workflow_dispatch:

# Lecture seule : le workflow n'a besoin d'écrire nulle part
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Échoue sur une vulnérabilité haute ou critique d'une dépendance de production
      - run: npm audit --omit=dev --audit-level=high
      # Échoue si la couverture de la logique descend sous 100 %
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Lance le site sur MongoDB en mémoire + faux Stripe (tests/e2e/server/start.ts)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
